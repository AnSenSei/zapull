steps:
  # Build the Docker image with all environment variables
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-docker.pkg.dev/$PROJECT_ID/frontend/frontend:latest'
      - '--build-arg'
