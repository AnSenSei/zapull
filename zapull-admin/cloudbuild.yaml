steps:
  # Build the Docker image with timestamp tag and environment variables
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'Dockerfile.prod',
      '--build-arg', 'VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}',
      '--build-arg', 'VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}',
      '--build-arg', 'VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}',
      '--build-arg', 'VITE_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}',
      '--build-arg', 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}',
      '--build-arg', 'VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}',
      '--build-arg', 'VITE_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}',
      '--build-arg', 'VITE_APP_TITLE=Zapull Admin',
      '--build-arg', 'VITE_API_URL=https://backend-769075815684.us-central1.run.app/gacha/api/v1',
      '-t', 'us-docker.pkg.dev/zapull-production/frontend/admin:${_VERSION_TAG}',
      '.'
    ]
  
  # Also tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'us-docker.pkg.dev/zapull-production/frontend/admin:${_VERSION_TAG}', 'us-docker.pkg.dev/zapull-production/frontend/admin:latest']

# Push both tags to Artifact Registry
images:
  - 'us-docker.pkg.dev/zapull-production/frontend/admin:${_VERSION_TAG}'
  - 'us-docker.pkg.dev/zapull-production/frontend/admin:latest'

substitutions:
  _VERSION_TAG: ${SHORT_SHA}
  # Firebase configuration - real values
  _FIREBASE_API_KEY: "AIzaSyD0lPBblDCNaRVIJzt0vr3589EbzEDlROQ"
  _FIREBASE_AUTH_DOMAIN: "zapull-production.firebaseapp.com"
  _FIREBASE_PROJECT_ID: "zapull-production"
  _FIREBASE_STORAGE_BUCKET: "zapull-production.firebasestorage.app"
  _FIREBASE_MESSAGING_SENDER_ID: "769075815684"
  _FIREBASE_APP_ID: "1:769075815684:web:94a8d97592c6f3fbf95c51"
  _FIREBASE_MEASUREMENT_ID: "G-V5SJVMMW0F"

options:
  logging: CLOUD_LOGGING_ONLY